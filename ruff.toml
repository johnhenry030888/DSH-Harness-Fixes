# House base Ruff config (per-project overrides win).
line-length = 88
target-version = "py313"

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = []

[lint.isort]
combine-as-imports = true
force-sort-within-sections = true
