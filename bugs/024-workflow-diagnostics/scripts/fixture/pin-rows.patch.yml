          provider: opencode-go
          model: glm-5.3-flash
    - id: tool-subagent-pin-unknown-p24
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_pin_unk_p24
        backgroundMode: one-shot
        maxDepth: 1
        agentOptions:
          provider: opencode-go
          model: totally-invented-model-xyz
